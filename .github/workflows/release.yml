name: Release

# Push a tag like v1.0.0 -> build the package, create a GitHub release and upload it to CurseForge.
#   - Tag contains "alpha" -> alpha, contains "beta" -> beta, otherwise release
#   - The version is taken from the tag (@project-version@ in the .toc)
#   - Uploading to CurseForge needs "## X-Curse-Project-ID" in the .toc and the secret CF_API_KEY
# Manual run (workflow_dispatch) -> only build the package, upload nothing (zip as artifact for testing).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the packager needs the history for changelog and version

      - name: Build and publish package
        if: github.ref_type == 'tag'
        uses: BigWigsMods/packager@v2

      - name: Build package only (test)
        if: github.ref_type != 'tag'
        uses: BigWigsMods/packager@v2
        with:
          args: -d   # -d = don't upload anything

      - name: Upload zip as artifact
        uses: actions/upload-artifact@v6
        with:
          name: Baganator_ReagentBagCategory
          path: .release/*.zip
          include-hidden-files: true
